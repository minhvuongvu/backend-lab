# Shared observability stack for all topics.
#   make obs-up   -> Prometheus http://localhost:9090, Grafana http://localhost:3000 (admin/admin)
#   make obs-down
# Ports are overridable if taken: make obs-up PROM_PORT=19090 GRAFANA_PORT=13000
# k6 pushes metrics via remote write: k6 run -o experimental-prometheus-rw
#   (K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9090/api/v1/write)
name: backend-lab-obs

services:
  prometheus:
    image: prom/prometheus:v3.13.4  # LTS line
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROM_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; Docker Desktop resolves it natively
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
